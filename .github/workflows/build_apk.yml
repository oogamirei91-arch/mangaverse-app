name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Pasang Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Pasang Keystore Konsisten (agar signature sertifikat APK selalu konsisten & tidak bentrok saat update)
      - name: Setup Consistent Keystore
        run: |
          mkdir -p ~/.android
          cp .github/keystores/debug.keystore ~/.android/debug.keystore

      # 4. Pasang Flutter SDK versi stabil terbaru
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Generate folder Android otomatis & pastikan nama aplikasi adalah "KuroReader"
      - name: Generate Android Platform Files (If Missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, men-generate struktur platform Android..."
            flutter create . --platforms=android --org=com.kuroreader.app --project-name=kuro_reader
          fi
          # Setel nama aplikasi di HP agar tampil sebagai KuroReader
          sed -i 's/android:label="[^"]*"/android:label="KuroReader"/g' android/app/src/main/AndroidManifest.xml
          # Pastikan izin INTERNET & usesCleartextTraffic tersedia untuk Suwayomi & pemutar video
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml
          fi
          # Pastikan izin BIOMETRIC & FINGERPRINT tersedia untuk local_auth (sidik jari & biometrik)
          if ! grep -q "android.permission.USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>/' android/app/src/main/AndroidManifest.xml
          fi
          # Pastikan MainActivity mewarisi FlutterFragmentActivity agar dialog sidik jari (local_auth) berjalan normal
          for kt in $(find android/app/src/main -name "MainActivity.kt"); do
            echo "Patching $kt with FlutterFragmentActivity..."
            PKG=$(grep "^package " "$kt" | head -n 1)
            printf "%s\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity: FlutterFragmentActivity() {\n}\n" "$PKG" > "$kt"
            echo "--- $kt content ---"
            cat "$kt"
          done
          for jv in $(find android/app/src/main -name "MainActivity.java"); do
            sed -i 's/import io.flutter.embedding.android.FlutterActivity;/import io.flutter.embedding.android.FlutterFragmentActivity;/g' "$jv"
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$jv"
          done
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          # Pastikan minSdkVersion minimal 21 untuk webview_flutter & local_auth di semua build.gradle / build.gradle.kts
          find android/app -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +

      # 5. Unduh dependensi aplikasi (pub get)
      - name: Install Dependencies
        run: flutter pub get

      # 6. Generate Ikon Launcher Resmi KuroReader (Konsep 1)
      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      # 7. Kompilasi APK mode Release
      - name: Build Release APK
        run: |
          flutter analyze || true
          flutter build apk --release --verbose

      # 8. Unggah file APK ke tab Artifacts GitHub agar bisa langsung di-download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuroreader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

name: kuro_reader
description: "KuroReader - A modern Manga, Manhwa & Comic Reader Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & API
  http: ^1.2.1

  # Image Caching & Viewer
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  photo_view: ^0.14.0

  # Video & Web Player
  webview_flutter: ^4.7.0
  encrypt: ^5.0.3
  url_launcher: ^6.2.6

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Authentication & Security
  google_sign_in: ^6.2.1
  local_auth: ^2.2.0

  # UI Styling & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1015"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

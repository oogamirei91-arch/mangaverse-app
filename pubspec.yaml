name: manga_app
description: "KuroReader - A modern Manga, Manhwa & Comic Reader Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & API
  http: ^1.2.1

  # Image Caching & Viewer
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  photo_view: ^0.14.0

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Authentication
  google_sign_in: ^6.2.1

  # UI Styling & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
